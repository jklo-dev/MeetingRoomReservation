spring:
  application:
    name: MeetingRoomReservation

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:meetroom}
    username: ${DB_USER:meetroom}
    password: ${DB_PASSWORD:}

  jpa:
    # El esquema lo crea Flyway. Hibernate solo comprueba que las entidades
    # coincidan con lo que las migraciones han creado.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        # Solo el endpoint de salud. Actuator ya expone unicamente health e info por defecto,
        # pero declararlo evita que una version futura o una dependencia nueva expongan algo mas
        # sin que nadie lo note.
        include: health
  endpoint:
    health:
      # Sin detalle por componente: el endpoint es publico y el detalle revelaria el motor de
      # base de datos, su version y el estado de las migraciones a cualquiera que pregunte.
      show-details: never

meetroom:
  security:
    jwt:
      # Sin valor por defecto a proposito: la aplicacion no arranca si no se define.
      # HS256 exige al menos 32 bytes.
      secret: ${JWT_SECRET:}
      issuer: meetroom
      # Vigencia en segundos. Se usara al emitir en la funcionalidad 002.
      ttl-seconds: 86400
