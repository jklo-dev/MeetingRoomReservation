version: '2'

services:
  postgres:
    image: postgres:17-alpine
    container_name: meetroom-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_EXPOSED_PORT}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
    container_name: meetroom-backend
    restart: unless-stopped

    depends_on:
      - postgres

    env_file:
      - .env

    ports:
      - "${APP_PORT}:8080"

volumes:
  pgdata:
